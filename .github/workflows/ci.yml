name: CI
# Runs on every pull request and every feature branch push: unit tests plus a debug build.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --console=plain
