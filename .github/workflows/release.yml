name: Release
# Runs when a pull request is merged into main (or on a manual run). Tests, builds a signed APK,
# picks the next version number, tags it and publishes a GitHub Release with the APK attached.
# Version rule: a commit or PR title starting with "feat" bumps the minor number (0.3.x -> 0.4.0),
# a title containing "BREAKING" bumps the major number, anything else bumps the patch number.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "supabase/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Next version
        id: v
        run: |
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.3.0}
          IFS=. read -r MA MI PA <<< "${last#v}"
          msg=$(git log -1 --format=%s)
          if   [[ "$msg" == *BREAKING* ]]; then MA=$((MA+1)); MI=0; PA=0
          elif [[ "$msg" =~ ^[Ff]eat ]];  then MI=$((MI+1)); PA=0
          else PA=$((PA+1)); fi
          echo "version=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
          echo "Releasing v$MA.$MI.$PA (previous $last)"

      - name: Write local.properties from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INVITE_BASE: ${{ secrets.INVITE_BASE }}
          INVITE_HOST: ${{ secrets.INVITE_HOST }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            [ -n "$SUPABASE_URL" ] && echo "SUPABASE_URL=$SUPABASE_URL"
            [ -n "$SUPABASE_ANON_KEY" ] && echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            [ -n "$INVITE_BASE" ] && echo "INVITE_BASE=$INVITE_BASE"
            [ -n "$INVITE_HOST" ] && echo "INVITE_HOST=$INVITE_HOST"
          } > local.properties
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/hissa-release.jks
            {
              echo "RELEASE_STORE_FILE=keystore/hissa-release.jks"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS:-hissa}"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> local.properties
          fi

      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease -PversionName=${{ steps.v.outputs.version }} -PversionCode=${{ github.run_number }} --console=plain
      - run: cp app/build/outputs/apk/release/app-release.apk Hissa-${{ steps.v.outputs.version }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" "Hissa-${{ steps.v.outputs.version }}.apk" \
            --title "Hissa ${{ steps.v.outputs.version }}" --generate-notes --target "$GITHUB_SHA"
