<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join a Hissa group</title>
<meta name="theme-color" content="#111111">
<style>
  :root{--ink:#111;--paper:#fff;--mute:#6b6b6b;--line:#e6e6e6;--brand:#ffb020}
  @media (prefers-color-scheme:dark){:root{--ink:#fff;--paper:#111;--mute:#a0a0a0;--line:#2a2a2a}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  main{width:100%;max-width:380px;text-align:center}
  .logo{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;background:#111;display:grid;place-items:center}
  .logo svg{width:44px;height:44px}
  h1{font-size:28px;line-height:1.15;margin:0 0 8px}
  p{color:var(--mute);margin:0 0 20px}
  .code{display:inline-block;margin:4px 0 20px;padding:10px 18px;border:1px solid var(--line);border-radius:14px;font:600 20px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;user-select:all}
  .btn{display:block;width:100%;padding:15px 20px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;margin-top:12px}
  .primary{background:var(--brand);color:#111}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  small{display:block;margin-top:20px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 48 48"><rect x="9" y="8" width="8" height="32" rx="4" fill="#fff"/><rect x="31" y="8" width="8" height="32" rx="4" fill="#fff"/><rect x="9" y="20" width="30" height="8" rx="4" fill="#ffb020"/></svg>
  </div>
  <h1>You're invited to a group</h1>
  <p>Open Hissa to join and start splitting bills.</p>
  <div class="code" id="code"></div>
  <a class="btn primary" id="open" href="#">Open in Hissa</a>
  <button class="btn ghost" id="copy" type="button">Copy invite code</button>
  <a class="btn ghost" id="get" href="#" hidden>Get the app (Android)</a>
  <small>Don't have Hissa yet? Install it first, then tap Open in Hissa again, or paste the code into Join with a code.</small>
</main>
<script>
  // Works for  .../join/?code=CODE  and  .../join/CODE  (the second needs a 404 page that forwards here).
  var q = new URLSearchParams(location.search).get("code");
  var last = location.pathname.replace(/\/+$/, "").split("/").pop();
  var code = (q || (/^[a-z0-9]{6,16}$/i.test(last) ? last : "")).toLowerCase();
  var el = function (id) { return document.getElementById(id); };
  el("code").textContent = code || "No code in this link";
  var link = "hissa://join/" + encodeURIComponent(code);
  el("open").href = link;
  el("copy").onclick = function () {
    var done = function () { el("copy").textContent = "Copied"; };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(done); else { var r = document.createRange(); r.selectNodeContents(el("code")); getSelection().addRange(r); document.execCommand("copy"); done(); }
  };
  // On GitHub Pages the APK lives in the repo's latest release.
  var m = location.hostname.match(/^([^.]+)\.github\.io$/), repo = location.pathname.split("/")[1];
  if (m && repo) { el("get").href = "https://github.com/" + m[1] + "/" + repo + "/releases/latest/download/Hissa.apk"; el("get").hidden = false; }
  if (code && /Android/i.test(navigator.userAgent)) setTimeout(function () { location.href = link; }, 400);
</script>
</body>
</html>
