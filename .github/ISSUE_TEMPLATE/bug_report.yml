name: Bug report
description: Something in Hissa is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hissa version
      placeholder: "0.4.3 (Account tab, bottom)"
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 7, Android 14"
